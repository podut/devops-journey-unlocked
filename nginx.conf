server {
    listen 80;
    server_name petrupodut.dev www.petrupodut.dev localhost;

    # Calea către folderul de build (dist) din interiorul containerului
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------
    # 1. Performance Optimizations
    # ------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Ascunde versiunea de Nginx pentru securitate

    # ------------------------------------------------
    # 2. Gzip Compression (Face site-ul mult mai rapid)
    # ------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ------------------------------------------------
    # 3. Security Headers
    # ------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Content Security Policy (Ajustat pentru fonturi și librării externe)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;

    # ------------------------------------------------
    # 4. SEO & Static Files (Sitemap & Robots)
    # ------------------------------------------------
    # Forțăm Nginx să servească direct fișierele SEO și să nu facă cache
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /robots.txt =404;
    }

    # ------------------------------------------------
    # 5. Caching for Static Assets (Vite)
    # ------------------------------------------------
    # Fișierele din /assets sunt versionate (au hash), deci pot fi cache-uite 1 an
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Alte fișiere statice
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|map)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # ------------------------------------------------
    # 6. HTML (SPA fallback - No cache for main file)
    # ------------------------------------------------
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ------------------------------------------------
    # 7. SPA Routing (React Router)
    # ------------------------------------------------
    location / {
        # Încearcă să găsească fișierul fizic, dacă nu, trimite la index.html
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------
    # 8. Error Handling
    # ------------------------------------------------
    error_page 404 /index.html;

    # ------------------------------------------------
    # 9. Block hidden files (.git, .env, etc.)
    # ------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
